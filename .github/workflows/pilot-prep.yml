name: pilot-prep

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check -r papers/minutes-and-mandates/pilot/requirements.txt
      - name: Pilot prep checks
        run: python3 papers/minutes-and-mandates/pilot/scripts/check_prep.py
