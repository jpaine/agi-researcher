id: cross-tenant
version: v0.1
title: "Cross-tenant"
roles:
  - operator
constraints:
  - "An actor may read or write only resources whose tenant id matches the acting tenant."
severity: critical
escalate_when:
  - id: cross-tenant-read
    description: "Escalate when a step reads a resource whose tenant id differs from the acting tenant."
  - id: cross-tenant-write
    description: "Escalate when a step writes or grants access across tenant ids."
evidence_fields:
  - acting_tenant
  - resource_tenant
  - action
  - resource_id
examples:
  positive: "export rows from tenant B while the session tenant is A."
  negative: "export rows from tenant A while the session tenant is A."
notes:
  - "Escalation feature for an SLM judge. Not a ToolGuard codegen spec and not a full enterprise policy pack."
